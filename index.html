<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <!-- Importing Font Awesome for the search and mic icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Resetting default browser margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            font-size: 13px;
        }

        header a {
            text-decoration: none;
            color: rgba(0,0,0,0.87);
            margin-right: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .nav-icon {
            font-size: 20px;
            color: #5f6368;
            margin-left: 15px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .nav-icon:hover {
            background-color: rgba(60,64,67,0.08);
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-left: 10px;
            background-color: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -100px; /* Pulls content up slightly for better visual balance */
        }

        .logo {
            width: 272px;
            margin-bottom: 30px;
        }

        /* Search Box Container */
        .search-container {
            width: 100%;
            max-width: 584px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            height: 46px;
            transition: box-shadow 0.2s;
        }

        .search-container:hover, .search-container:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-container i {
            color: #9aa0a6;
            margin-left: 14px;
            font-size: 16px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
        }

        .mic-icon, .lens-icon {
            cursor: pointer;
            margin-right: 15px;
        }

        /* Buttons Area */
        .button-container {
            margin-top: 30px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 0 5px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* Footer Area */
        footer {
            background-color: #f2f2f2;
            color: rgba(0,0,0,0.54);
            font-size: 14px;
        }

        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }

        .footer-links a {
            text-decoration: none;
            color: rgba(0,0,0,0.54);
            margin-right: 25px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .footer-bottom {
                justify-content: center;
            }
            .footer-links a {
                margin: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Nav -->
    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="nav-icon"><i class="fas fa-th"></i></div>
        <div class="profile-pic">U</div>
    </header>

    <!-- Main Section -->
    <main>
        <!-- Google Logo (using a high-quality placeholder) -->
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo">

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input">
            <img class="lens-icon" src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Google_Lens_icon.svg" width="24" alt="Lens">
            <i class="fas fa-microphone mic-icon"></i>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <button class="btn">Google Search</button>
            <button class="btn">I'm Feeling Lucky</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-top">
            <span>United States</span>
        </div>
        <div class="footer-bottom">
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
